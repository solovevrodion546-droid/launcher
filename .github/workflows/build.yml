name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подготовить проект
        run: |
          set -e
          mkdir -p unpacked
          ZIP=$(find . -path ./.git -prune -o -path ./unpacked -prune -o -name "*.zip" -print | head -1)
          if [ -n "$ZIP" ]; then
            echo "Нашёл архив: $ZIP"
            unzip -o "$ZIP" -d unpacked
          elif [ -f VoidLiteLauncher/settings.gradle.kts ]; then
            echo "Проект загружен папкой"
            cp -r VoidLiteLauncher unpacked/
          elif [ -f settings.gradle.kts ]; then
            echo "Файлы проекта лежат в корне репозитория"
            mkdir -p unpacked/VoidLiteLauncher
            cp -r app settings.gradle.kts build.gradle.kts gradle.properties unpacked/VoidLiteLauncher/
          else
            echo "ОШИБКА: не найден ни ZIP-архив, ни файлы проекта"
            exit 1
          fi
          if [ -f unpacked/settings.gradle.kts ]; then
            mkdir -p unpacked/VoidLiteLauncher
            find unpacked -mindepth 1 -maxdepth 1 ! -name VoidLiteLauncher -exec mv {} unpacked/VoidLiteLauncher/ \;
          fi
          ls unpacked/VoidLiteLauncher

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установить Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Собрать APK
        working-directory: unpacked/VoidLiteLauncher
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Загрузить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: void-lite-apk
          path: unpacked/VoidLiteLauncher/app/build/outputs/apk/debug/app-debug.apk
